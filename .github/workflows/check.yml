name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2-stable
  # SHA512 of Godot_v4.7.2-stable_win64.exe.zip, from the release's SHA512-SUMS.txt.
  GODOT_ZIP_SHA512: 83decd58fdf67b9d657958a1ae6bf1929c20785315a81effe245874cdc57acb709bf868e00778a96984338c1b29dafdb453c6847747694621c6ecf5da2259993

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Cache Godot engine
        id: godot-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/godot
          key: godot-${{ env.GODOT_VERSION }}-win64-${{ env.GODOT_ZIP_SHA512 }}

      - name: Download Godot engine
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'godot'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'godot.zip'
          $url = "https://github.com/godotengine/godot-builds/releases/download/$env:GODOT_VERSION/Godot_v${env:GODOT_VERSION}_win64.exe.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA512 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($actual -ne $env:GODOT_ZIP_SHA512) { throw "SHA512 mismatch: expected $env:GODOT_ZIP_SHA512, got $actual" }
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          Remove-Item $zip

      - name: Run full check
        shell: pwsh
        run: |
          $env:GODOT_EXE = Join-Path $env:RUNNER_TEMP "godot\Godot_v${env:GODOT_VERSION}_win64_console.exe"
          powershell -ExecutionPolicy Bypass -File scripts/check.ps1
          exit $LASTEXITCODE
